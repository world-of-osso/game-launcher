[package]
name = "game-launcher"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
dioxus = "0.7"
hex = "0.4"
# Retry-After accepts HTTP dates as well as delay seconds.
httpdate = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs-next = "2"
# Portable available space and allocation-granularity preflight before transfers.
fs2 = "0.4.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process", "io-util"] }
dioxus-debug = { git = "https://github.com/Osso/dioxus-debug.git", features = ["server"], optional = true }
open = "5.3.3"
base64 = "0.22.1"

# Native UTF-16 Shell links; avoids the legacy scripting host's ANSI path handling.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

# Embed the same app icon in the Windows executable, installer and shell links.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[package.metadata.packager]
product-name = "World of Osso"
identifier = "com.worldofosso.launcher"
publisher = "World of Osso"
icons = ["assets/world-of-osso.ico"]
formats = ["nsis"]
out-dir = "dist"
binaries = [{ path = "game-launcher", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/world-of-osso.ico"

[features]
default = ["desktop", "debug"]
desktop = ["dioxus/desktop"]
debug = ["dioxus-debug"]
